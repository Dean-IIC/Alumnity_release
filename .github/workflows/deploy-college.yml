# Deploys Alumnity to the college's Vercel (team HKBK, project "alumnity") on every push to
# main, the same code as the live site. The college's Vercel can't see this GitHub account,
# so instead of Vercel's own GitHub link, this job deploys with the college's token.
# Secrets (repo Settings > Secrets > Actions): COLLEGE_VERCEL_TOKEN, COLLEGE_VERCEL_ORG_ID,
# COLLEGE_VERCEL_PROJECT_ID. The site's own settings (database, keys) live in that Vercel
# project, not here.
name: Deploy to the college's Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the one running.
concurrency:
  group: college-vercel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.COLLEGE_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.COLLEGE_VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Built on Vercel, as any Vercel deploy is; the code is uploaded from this checkout.
      - name: Deploy (production)
        run: npx --yes vercel@latest deploy --prod --yes --token="${{ secrets.COLLEGE_VERCEL_TOKEN }}"
